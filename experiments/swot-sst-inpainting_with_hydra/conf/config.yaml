# config.yaml - Place this in a 'conf' directory
# Model architecture and training configuration
model:
  hid_channels: [128, 256, 384]
  hid_blocks: [5, 5, 5]
  kernel_size: [3, 3]
  emb_features: 256
  heads: 
    1: 4
  dropout: 0.1

# Diffusion sampling configuration  
diffusion:
  sampler: ddpm
  sde:
    a: 1e-3
    b: 1e2
  heuristic: null
  discrete: 256
  maxiter: 1

# Training configuration
training:
  epochs: 256
  batch_size: 256
  scheduler: constant
  lr_init: 2e-4
  lr_end: 1e-6
  lr_warmup: 0.0
  optimizer: adam
  weight_decay: null
  clip: 1.0
  ema_decay: 0.9999

# Data configuration
data:
  source: "/home/tm3076/scratch/priors_precomputed_datasets/precomputed_data_sst/sst_crho_0.4"
  format: "zarr"
  moment_fitting_samples: 6144
  ppca_samples: 16384

# Experiment configuration
experiment:
  project_name: "priors-SST-mask"
  num_laps: 32
  
# Job scheduling configuration
slurm:
  cpus: 4
  gpus: 4
  ram: "128GB"
  time: "1-00:00:00"
  partition: "h200"
  singularity_image: "/share/apps/images/cuda12.8.1-cudnn9.8.0-ubuntu24.04.2.sif"
  overlay_path: "/scratch/tm3076/singularity_container/EDIT_JAX-cuDNN9.8-overlay-15GB-500K.ext3"

# Debug and environment
debug:
  dry_run: false
  debug_mode: true

# Paths and environment
paths:
  scratch_env_var: "SCRATCH"
  default_path: "."
